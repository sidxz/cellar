services:
  postgres:
    image: informaticsmatters/rdkit-cartridge-debian:Release_2024_03_3
    environment:
      POSTGRES_USER: cellar
      POSTGRES_PASSWORD: cellar
      POSTGRES_DB: cellar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellar"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      temporal-db:
        condition: service_started
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8080:8080"

  temporal-worker:
    build: ./backend
    command: [".venv/bin/python", "-m", "cellar.infrastructure.temporal.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://cellar:cellar@postgres:5432/cellar
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      STORAGE_ROOT: /data/storage
      LOG_LEVEL: DEBUG
      INFISICAL_BASE_URL: http://infisical:8080
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
    volumes:
      - file-storage:/data/storage

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://cellar:cellar@postgres:5432/cellar
      REDIS_URL: redis://valkey:6379
      SENTINEL_URL: http://sentinel:9003
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      STORAGE_ROOT: /data/storage
      APP_ENV: development
      LOG_LEVEL: DEBUG
      INFISICAL_BASE_URL: http://infisical:8080
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - file-storage:/data/storage

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"

  infisical-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: infisical
      POSTGRES_DB: infisical
    volumes:
      - infisical-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      interval: 10s
      timeout: 5s
      retries: 5

  infisical:
    image: infisical/infisical:latest
    depends_on:
      infisical-db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DB_CONNECTION_URI: postgres://infisical:infisical@infisical-db:5432/infisical
      REDIS_URL: redis://valkey:6379
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:-6f2b5e3c8a1d4f7e9b0c2d5a8e3f1b4c}
      JWT_SIGNUP_SECRET: ${INFISICAL_JWT_SIGNUP:-dev-signup-secret-change-in-prod}
      JWT_AUTH_SECRET: ${INFISICAL_JWT_AUTH:-dev-auth-secret-change-in-prod}
      JWT_REFRESH_SECRET: ${INFISICAL_JWT_REFRESH:-dev-refresh-secret-change-in-prod}
      SITE_URL: http://localhost:8089
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:-dev-auth-secret-32-chars-minimum!}
    ports:
      - "8089:8080"

volumes:
  pgdata:
  temporal-pgdata:
  file-storage:
  infisical-pgdata:
