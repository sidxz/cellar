# Build-from-source app stack. Always combined with docker-compose.infra.yml:
#   docker compose -f docker-compose.infra.yml -f docker-compose.yml up
# CI build verification:
#   docker compose -f docker-compose.infra.yml -f docker-compose.yml build backend frontend
services:
  temporal-worker:
    build: ./backend
    command: [".venv/bin/python", "-m", "cellar.infrastructure.temporal.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cellar}:${POSTGRES_PASSWORD:-cellar}@postgres:5432/${POSTGRES_DB:-cellar}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      STORAGE_ROOT: /data/storage
      LOG_LEVEL: DEBUG
      INFISICAL_BASE_URL: http://infisical:8080
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
    volumes:
      - file-storage:/data/storage

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cellar}:${POSTGRES_PASSWORD:-cellar}@postgres:5432/${POSTGRES_DB:-cellar}
      REDIS_URL: redis://valkey:6379
      SENTINEL_URL: http://sentinel:9003
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      STORAGE_ROOT: /data/storage
      APP_ENV: development
      LOG_LEVEL: DEBUG
      INFISICAL_BASE_URL: http://infisical:8080
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - file-storage:/data/storage

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      APP_API_URL: ${APP_API_URL:-http://localhost:8000}
      APP_ENV: development
    ports:
      - "3000:3000"

volumes:
  file-storage:
