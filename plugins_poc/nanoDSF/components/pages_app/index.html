<!doctype html>
<html data-theme="midnight">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== themes (same as Overlay) ===================== */
:root, [data-theme="midnight"] {
  --bg: #0b1020; --panel: rgba(23, 31, 54, .62); --panel-solid: #151c31; --field: rgba(9, 13, 27, .55);
  --line: rgba(150, 170, 220, .12); --line2: rgba(150, 170, 220, .24);
  --text: #dfe5f2; --muted: #8b95b0; --dim: #5c6680;
  --accent: #9cc3e6; --accent-soft: rgba(156, 195, 230, .16); --accent-ink: #0d1424;
  --pos: #9fd8b8; --neg: #eba3b5; --warn: #f0c48a;
  --glow1: rgba(120, 140, 220, .10); --glow2: rgba(156, 195, 230, .06); --shadow: rgba(0, 0, 0, .45);
}
[data-theme="graphite"] {
  --bg: #111214; --panel: rgba(33, 35, 39, .72); --panel-solid: #1c1e22; --field: rgba(10, 10, 12, .5);
  --line: rgba(255, 255, 255, .08); --line2: rgba(255, 255, 255, .17);
  --text: #e7e6e3; --muted: #9b9a96; --dim: #64635f;
  --accent: #d1c2a1; --accent-soft: rgba(209, 194, 161, .15); --accent-ink: #1a1813;
  --pos: #a9d3a4; --neg: #e3a7a2; --warn: #e6bf8c;
  --glow1: rgba(209, 194, 161, .05); --glow2: rgba(255, 255, 255, .02); --shadow: rgba(0, 0, 0, .5);
}
[data-theme="dusk"] {
  --bg: #16111d; --panel: rgba(40, 30, 52, .62); --panel-solid: #221a2d; --field: rgba(14, 9, 20, .5);
  --line: rgba(225, 195, 240, .11); --line2: rgba(225, 195, 240, .22);
  --text: #efe7f3; --muted: #a798b4; --dim: #6c5f79;
  --accent: #e6b8cb; --accent-soft: rgba(230, 184, 203, .15); --accent-ink: #20141c;
  --pos: #acd9c6; --neg: #f0aaa6; --warn: #f1d39b;
  --glow1: rgba(200, 150, 220, .09); --glow2: rgba(230, 184, 203, .06); --shadow: rgba(0, 0, 0, .45);
}
[data-theme="paper"] {
  --bg: #f3f0ea; --panel: rgba(255, 255, 255, .78); --panel-solid: #ffffff; --field: rgba(245, 242, 236, .9);
  --line: rgba(70, 60, 45, .12); --line2: rgba(70, 60, 45, .24);
  --text: #2a2a2d; --muted: #77736c; --dim: #a8a39b;
  --accent: #5b7fa6; --accent-soft: rgba(91, 127, 166, .12); --accent-ink: #ffffff;
  --pos: #3e8b68; --neg: #b5566c; --warn: #b07f3e;
  --glow1: rgba(91, 127, 166, .06); --glow2: rgba(200, 160, 120, .05); --shadow: rgba(60, 50, 40, .18);
}
[data-theme="forest"] {
  --bg: #0e1712; --panel: rgba(26, 42, 33, .62); --panel-solid: #172219; --field: rgba(8, 14, 10, .55);
  --line: rgba(170, 220, 190, .12); --line2: rgba(170, 220, 190, .24);
  --text: #e3efe6; --muted: #8fa898; --dim: #5d7466;
  --accent: #9fd8b2; --accent-soft: rgba(159, 216, 178, .15); --accent-ink: #0e1712;
  --pos: #a9dcb8; --neg: #eba8a8; --warn: #e8cf8f; --tube: rgba(255, 255, 255, .028); --sheen: rgba(255, 255, 255, .10);
  --glow1: rgba(110, 190, 140, .10); --glow2: rgba(200, 230, 160, .05); --shadow: rgba(0, 0, 0, .45);
}
[data-theme="amethyst"] {
  --bg: #140f22; --panel: rgba(36, 26, 62, .62); --panel-solid: #1d1530; --field: rgba(10, 6, 20, .55);
  --line: rgba(200, 180, 255, .12); --line2: rgba(200, 180, 255, .24);
  --text: #ece6fa; --muted: #a397c2; --dim: #6b5f8c;
  --accent: #c3a8f5; --accent-soft: rgba(195, 168, 245, .16); --accent-ink: #160f26;
  --pos: #a8dcc4; --neg: #f0a6c0; --warn: #f1d39b; --tube: rgba(255, 255, 255, .028); --sheen: rgba(255, 255, 255, .10);
  --glow1: rgba(150, 110, 240, .12); --glow2: rgba(230, 160, 220, .06); --shadow: rgba(0, 0, 0, .45);
}
[data-theme="cream"] {
  --bg: #f7f2e7; --panel: rgba(255, 252, 245, .82); --panel-solid: #fffdf8; --field: rgba(243, 236, 222, .9);
  --line: rgba(90, 70, 40, .13); --line2: rgba(90, 70, 40, .25);
  --text: #2e2a24; --muted: #7a7166; --dim: #ada392;
  --accent: #a27a46; --accent-soft: rgba(162, 122, 70, .12); --accent-ink: #ffffff;
  --pos: #4b8a5c; --neg: #b4574f; --warn: #a8691c; --tube: rgba(0, 0, 0, .022); --sheen: rgba(255, 255, 255, .55);
  --glow1: rgba(200, 160, 100, .08); --glow2: rgba(160, 180, 140, .06); --shadow: rgba(70, 50, 20, .16);
}
[data-theme="sky"] {
  --bg: #dceaf8; --panel: rgba(240, 247, 255, .82); --panel-solid: #f2f8ff; --field: rgba(214, 229, 247, .9);
  --line: rgba(40, 80, 150, .14); --line2: rgba(40, 80, 150, .27);
  --text: #1f2a3a; --muted: #66758c; --dim: #9aa7ba;
  --accent: #3f7fc7; --accent-soft: rgba(63, 127, 199, .12); --accent-ink: #ffffff;
  --pos: #2f8a63; --neg: #c0506a; --warn: #b07f3e; --tube: rgba(0, 40, 100, .025); --sheen: rgba(255, 255, 255, .6);
  --glow1: rgba(80, 145, 235, .18); --glow2: rgba(120, 190, 245, .14); --shadow: rgba(30, 60, 120, .18);
}
[data-theme="twilight"] {
  --bg: #121429; --panel: rgba(32, 34, 70, .6); --panel-solid: #1b1d3a; --field: rgba(8, 9, 24, .55);
  --line: rgba(180, 180, 255, .12); --line2: rgba(180, 180, 255, .24);
  --text: #e6e6fa; --muted: #9b9cc4; --dim: #63648f;
  --accent: #f2b38c; --accent-soft: rgba(242, 179, 140, .15); --accent-ink: #121429;
  --pos: #a8dcc4; --neg: #f0a6b4; --warn: #f1d39b; --tube: rgba(255, 255, 255, .028); --sheen: rgba(255, 255, 255, .10);
  --glow1: rgba(120, 110, 230, .14); --glow2: rgba(240, 160, 120, .08); --shadow: rgba(0, 0, 0, .45);
}
[data-theme="dawn"] {
  --bg: #f7c88e; --panel: rgba(255, 233, 196, .72); --panel-solid: #fff3e2; --field: rgba(252, 222, 178, .78);
  --line: rgba(160, 70, 10, .18); --line2: rgba(160, 70, 10, .32);
  --text: #3b2216; --muted: #8a5a3a; --dim: #b98c66;
  --accent: #d9541a; --accent-soft: rgba(217, 84, 26, .15); --accent-ink: #ffffff;
  --pos: #3f8a50; --neg: #c0392f; --warn: #b8640f; --tube: rgba(120, 50, 0, .035); --sheen: rgba(255, 255, 255, .6);
  --glow1: rgba(255, 120, 40, .38); --glow2: rgba(110, 100, 190, .26); --shadow: rgba(120, 60, 20, .2);
}
[data-theme="day"] {
  --bg: #9fbdf0; --panel: rgba(235, 243, 255, .78); --panel-solid: #f2f7ff; --field: rgba(205, 222, 250, .85);
  --line: rgba(25, 70, 170, .16); --line2: rgba(25, 70, 170, .3);
  --text: #0f1f3d; --muted: #4b6290; --dim: #8ea2c8;
  --accent: #1f5fd6; --accent-soft: rgba(31, 95, 214, .13); --accent-ink: #ffffff;
  --pos: #1f8a5a; --neg: #c93b52; --warn: #a8700f; --tube: rgba(0, 30, 100, .03); --sheen: rgba(255, 255, 255, .7);
  --glow1: rgba(40, 100, 230, .38); --glow2: rgba(120, 175, 255, .35); --shadow: rgba(20, 50, 120, .2);
}
:root { --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; color: var(--text);
  font: 12.5px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
#app { position: relative; display: flex; flex-direction: column; gap: 10px; height: 860px; padding: 2px; }
.card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); backdrop-filter: blur(12px); }

/* toolbar */
.bar { position: relative; z-index: 20; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px; padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel); backdrop-filter: blur(14px); }
.brand { display: flex; align-items: center; gap: 9px; margin-right: 4px; align-self: center; }
.brand .logo { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); border: 1px solid var(--line2); }
.brand .logo svg { width: 14px; height: 14px; color: var(--accent); }
.brand b { font-weight: 650; letter-spacing: -.01em; font-size: 13px; }
.brand span { display: block; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.grp { display: flex; flex-direction: column; gap: 4px; }
.grp > label, .lab { font-size: 9px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--dim); padding-left: 2px; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--field); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; color: var(--muted); font-size: 11.5px; font-weight: 500; padding: 5px 9px; border-radius: 7px;
  cursor: pointer; white-space: nowrap; transition: color .12s, background .12s; }
.seg button:hover { color: var(--text); }
.seg button.on { color: var(--text); background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.btn { border: 1px solid var(--line); background: var(--field); color: var(--muted); border-radius: 9px; padding: 6px 11px; cursor: pointer;
  font-size: 11.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; height: 31px; }
.btn:hover { color: var(--text); border-color: var(--line2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg { width: 14px; height: 14px; }
.btn.primary { color: var(--accent-ink); background: var(--accent); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); color: var(--accent-ink); }
.btn.danger { color: var(--neg); border-color: color-mix(in srgb, var(--neg) 40%, transparent); }
.btn.danger:hover { background: color-mix(in srgb, var(--neg) 12%, transparent); }
.spacer { flex: 1; }
.field { height: 31px; border-radius: 9px; border: 1px solid var(--line); background: var(--field); color: var(--text); padding: 0 10px; outline: none;
  transition: border-color .12s; min-width: 0; }
.field:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.field::placeholder { color: var(--dim); }
select.field { appearance: none; -webkit-appearance: none; padding-right: 26px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 13px) 13px, calc(100% - 9px) 13px; background-size: 4px 4px; background-repeat: no-repeat; }
.search { position: relative; }
.search .field { padding-left: 30px; width: 240px; }
.search svg { position: absolute; left: 9px; top: 8px; width: 15px; height: 15px; color: var(--muted); }
.menu { position: relative; }
.pop { position: absolute; z-index: 60; right: 0; top: 36px; display: none; min-width: 230px; background: var(--panel-solid); border: 1px solid var(--line2);
  border-radius: 12px; padding: 6px; box-shadow: 0 18px 40px -12px var(--shadow); }
.menu.open .pop { display: block; }
.pop button.item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px;
  border-radius: 8px; cursor: pointer; color: var(--text); }
.pop button.item:hover, .pop button.item.on { background: var(--accent-soft); }
.pop small { display: block; color: var(--muted); font-size: 10.5px; }
.pop .txt { padding: 10px 12px; color: var(--muted); line-height: 1.55; max-width: 420px; }
.pop .txt b { color: var(--text); }
.sw4 { display: inline-grid; grid-template-columns: repeat(2, 9px); gap: 2px; padding: 3px; border-radius: 6px; border: 1px solid var(--line2); flex: none; }
.sw4 i { width: 9px; height: 9px; border-radius: 2px; display: block; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 10.5px;
  font-weight: 600; letter-spacing: .03em; cursor: pointer; white-space: nowrap; }
.chip:hover { color: var(--text); border-color: var(--line2); }
.stat { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  font-size: 11px; white-space: nowrap; }
.stat b { font: 600 12px var(--mono); color: var(--text); }
.pill { font: 600 9px var(--mono); letter-spacing: .08em; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line2); color: var(--muted); }
.pill.ctrl { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.pill.raw { color: var(--pos); border-color: color-mix(in srgb, var(--pos) 45%, transparent); }
.pill.proc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }

/* tables */
.tw { flex: 1; min-height: 0; overflow: auto; padding: 0 8px 8px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th { position: sticky; top: 0; z-index: 2; background: var(--panel-solid); text-align: left; font: 600 9px Inter; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
th.num, td.num { text-align: right; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--text); }
th .arr { color: var(--accent); margin-left: 4px; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.num { font: 500 11.5px var(--mono); }
td.mono { font: 500 11.5px var(--mono); color: var(--muted); }
tr:hover td { background: var(--accent-soft); }
td .cd { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--c); vertical-align: 1px; }
td.pos { color: var(--pos); } td.neg { color: var(--neg); } td.na { color: var(--dim); }
.empty { display: grid; place-items: center; height: 100%; text-align: center; color: var(--muted); padding: 30px; }
.empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }

/* edit grid */
.ed td { padding: 3px 6px; }
.ed td.cap { font: 500 11px var(--mono); color: var(--muted); padding-left: 10px; }
.ed input.cell, .ed select.cell { width: 100%; height: 27px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text);
  padding: 0 8px; outline: none; transition: border-color .1s, background .1s; }
.ed input.cell:hover, .ed select.cell:hover { border-color: var(--line); }
.ed input.cell:focus, .ed select.cell:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: var(--field); }
.ed input.num { font-family: var(--mono); text-align: right; }
.ed select.cell { appearance: none; -webkit-appearance: none; cursor: pointer; }
.ed tr.chg td { background: color-mix(in srgb, var(--warn) 6%, transparent); }
.ed tr.sel td { background: var(--accent-soft); }
.ed tr.skip td { opacity: .45; }
.ed input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
.role-sample { color: var(--text); } .role-control { color: var(--accent); } .role-blank { color: var(--muted); } .role-skip { color: var(--dim); }
.side { display: flex; flex-direction: column; gap: 12px; padding: 14px; overflow: auto; }
.side h3 { margin: 0; font-size: 12px; font-weight: 600; }
.side .hint { color: var(--muted); font-size: 11px; line-height: 1.5; }
.row { display: flex; gap: 6px; align-items: center; }
.row .field { flex: 1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 11.5px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sep { height: 1px; background: var(--line); margin: 2px 0; }
.dirty { color: var(--warn); font-size: 11px; font-weight: 600; display: none; align-items: center; gap: 6px; align-self: center; }
.dirty.on { display: inline-flex; }
.dirty i { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

/* add page */
.addwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 10px; }
.drop { position: relative; display: grid; place-items: center; text-align: center; border: 1.5px dashed var(--line2); border-radius: 14px; padding: 26px;
  cursor: pointer; transition: border-color .15s, background .15s; color: var(--muted); }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.drop svg { width: 34px; height: 34px; color: var(--accent); margin-bottom: 10px; }
.drop b { display: block; color: var(--text); font-size: 14px; margin-bottom: 4px; }
.drop.small { padding: 14px; }
.drop.small svg { width: 20px; height: 20px; margin: 0 0 4px; }
.drop input { display: none; }
.files { display: flex; flex-direction: column; gap: 8px; }
.file { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); }
.file svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.file .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.file .meta { color: var(--muted); font: 500 11px var(--mono); white-space: nowrap; }
.form { display: flex; flex-direction: column; gap: 12px; padding: 16px; overflow: auto; }
.f { display: flex; flex-direction: column; gap: 5px; }
.form .f .field { width: 100%; }
.check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11.5px; cursor: pointer; }
.check input { accent-color: var(--accent); }
.steps { display: flex; flex-direction: column; gap: 10px; padding: 16px; overflow: auto; }
.step { display: flex; gap: 12px; }
.step .n { width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--mono);
  border: 1px solid var(--line2); color: var(--muted); }
.step.done .n { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.step .t { flex: 1; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
.step .t b { color: var(--text); display: block; font-size: 12.5px; margin-bottom: 2px; }
.ok { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border-radius: 12px;
  border: 1px solid color-mix(in srgb, var(--pos) 40%, transparent); background: color-mix(in srgb, var(--pos) 8%, transparent); }
.ok b { color: var(--pos); font-size: 13px; }

/* confirm + toast */
.modal { position: absolute; inset: 0; z-index: 90; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(3px); }
.modal.on { display: grid; }
.modal .box { width: 380px; padding: 18px; border-radius: 14px; background: var(--panel-solid); border: 1px solid var(--line2); box-shadow: 0 24px 60px -16px var(--shadow); }
.modal h3 { margin: 0 0 6px; font-size: 14px; }
.modal p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
.modal .row { justify-content: flex-end; }
.toast { position: absolute; right: 18px; bottom: 18px; z-index: 95; max-width: 460px; padding: 10px 14px; border-radius: 10px; background: var(--panel-solid);
  border: 1px solid var(--line2); box-shadow: 0 10px 30px -10px var(--shadow); font-size: 12px; opacity: 0; transform: translateY(6px); transition: all .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast.err { border-color: color-mix(in srgb, var(--neg) 60%, transparent); color: var(--neg); }
.busy { position: absolute; inset: 0; z-index: 85; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 35%, transparent); }
.busy.on { display: grid; }
.busy i { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
::-webkit-scrollbar { width: 7px; height: 7px; } ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; } ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  const post = (type, extra) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra || {}), "*");

      $("#selAll").onchange = e => { ES.sel = e.target.checked ? new Set(ES.rows.map(r => r.cap)) : new Set(); drawGrid(); drawSide(); };
      $$("#grid .rs").forEach(cb => cb.onclick = e => {
        const i = +cb.closest("tr").dataset.i, cap = ES.rows[i].cap;
        if (e.shiftKey && ES.anchor != null) { const [a, b] = [Math.min(ES.anchor, i), Math.max(ES.anchor, i)];
          for (let j = a; j <= b; j++) cb.checked ? ES.sel.add(ES.rows[j].cap) : ES.sel.delete(ES.rows[j].cap); }
        else cb.checked ? ES.sel.add(cap) : ES.sel.delete(cap);
        ES.anchor = i; drawGrid(); drawSide();
      });
      $$("#grid .cell").forEach(el => {
        const i = +el.dataset.i, k = el.dataset.k;
        const setv = v => { ES.rows[i][k] = k === "conc" ? (v === "" || isNaN(+v) ? null : +v) : v;
          el.closest("tr").classList.toggle("chg", JSON.stringify(ES.rows[i]) !== JSON.stringify(ES.orig[i]));
          if (k === "role") { el.className = "cell role-" + v; el.closest("tr").classList.toggle("skip", v === "skip"); }
          syncDirty(); };
        el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => setv(el.value));
        el.addEventListener("keydown", e => {   // Enter / arrows move up and down the column, like a spreadsheet
          if (["Enter", "ArrowDown", "ArrowUp"].includes(e.key) && el.tagName === "INPUT") {
            e.preventDefault(); const n = $(`#grid .cell[data-k="${k}"][data-i="${i + (e.key === "ArrowUp" ? -1 : 1)}"]`); if (n) { n.focus(); n.select(); } }
        });
        if (el.tagName === "INPUT") el.addEventListener("paste", e => {   // paste a column from Excel: fills downwards
          const t = (e.clipboardData || window.clipboardData).getData("text");
          if (!t.includes("\n")) return;
          e.preventDefault();
          const lines = t.replace(/\r/g, "").split("\n").filter((x, j, a) => !(j === a.length - 1 && x === ""));
          lines.forEach((ln, j) => { const row = ES.rows[i + j]; if (!row) return; const cells = ln.split("\t");
            const keys = COLS.map(c => c[0]), start = keys.indexOf(k);
            cells.forEach((v, c) => { const kk = keys[start + c]; if (!kk) return;
              if (kk === "conc") { const num = parseFloat(v.replace(",", ".")); row.conc = isNaN(num) ? null : num; }
              else if (kk === "role") { const rv = v.trim().toLowerCase(); if (ROLES.includes(rv)) row.role = rv; }
              else if (kk === "units") { if (v.trim()) row.units = v.trim(); }
              else row[kk] = v.trim(); }); });
          drawGrid(); syncDirty(); toast(`Pasted ${lines.length} row${lines.length === 1 ? "" : "s"}`);
        });
      });
    }
    function drawSide() {
      const r = R(), m = r.meta || {}, n = ES.sel.size, sel = () => ES.rows.filter(x => ES.sel.has(x.cap));
      $("#side").innerHTML = `
        <h3>Run</h3>
        <div class="kv"><span>Started</span><span>${esc((m.start_time || "—").replace("T", " ").slice(0, 16))}</span>
          <span>Capillaries</span><span>${m.n_capillaries ?? ES.rows.length}</span>
          <span>Controls</span><span>${ES.rows.filter(x => x.role === "control").length}</span>
          <span>Files</span><span title="${esc(Object.values(m.files || {}).join(", "))}">${esc(Object.values(m.files || {}).join(", ") || "—")}</span></div>
        <div class="sep"></div>
        <h3>Bulk edit <span style="color:var(--muted);font-weight:500">· ${n ? `${n} selected` : "nothing selected"}</span></h3>
        <div class="hint">${n ? "Applies to the ticked rows." : "Tick rows on the left (Shift-click for a range). Tip: you can also paste a whole column from Excel into the first cell."}</div>
        <div class="f"><span class="lab">Molecule ID</span><div class="row"><input class="field" id="bMol" placeholder="e.g. CMPD-0142"><button class="btn" id="aMol" ${n ? "" : "disabled"}>Apply</button></div></div>
        <div class="f"><span class="lab">Role</span><div class="seg" id="bRole">${P.roles.map(x => `<button data-v="${x}" ${n ? "" : "disabled"}>${x}</button>`).join("")}</div></div>
        <div class="f"><span class="lab">Units</span><div class="row"><select class="field" id="bUnits">${U.map(u => `<option>${u}</option>`).join("")}</select><button class="btn" id="aUnits" ${n ? "" : "disabled"}>Apply</button></div></div>
        <div class="sep"></div>
        <h3>Dilution series</h3>
        <div class="hint">Fills the ticked rows in capillary order, starting from the top concentration.</div>
        <div class="row"><div class="f" style="flex:1"><span class="lab">Top conc</span><input class="field" id="dTop" inputmode="decimal" placeholder="100" style="width:100%"></div>
          <div class="f" style="width:80px"><span class="lab">Fold</span><input class="field" id="dFold" inputmode="decimal" value="2" style="width:100%"></div></div>
        <div class="row"><div class="seg" id="dDir"><button data-v="down" class="on">High → low</button><button data-v="up">Low → high</button></div>
          <button class="btn" id="aDil" ${n ? "" : "disabled"}>Fill</button></div>
        <button class="btn" id="aClr" ${n ? "" : "disabled"} style="align-self:flex-start">Clear concentrations</button>`;
      const apply = (fn, msg) => { sel().forEach(fn); drawGrid(); syncDirty(); toast(msg); };
      $("#aMol").onclick = () => { const v = $("#bMol").value.trim(); if (!v) return; apply(x => x.mol = v, `Molecule ID set on ${n} rows`); };
      $$("#bRole button").forEach(b => b.onclick = () => apply(x => x.role = b.dataset.v, `Role “${b.dataset.v}” set on ${n} rows`));
      $("#aUnits").onclick = () => apply(x => x.units = $("#bUnits").value, `Units set on ${n} rows`);
      let dir = "down";
      $$("#dDir button").forEach(b => b.onclick = () => { dir = b.dataset.v; $$("#dDir button").forEach(x => x.classList.toggle("on", x === b)); });
      $("#aDil").onclick = () => {
        const top = parseFloat($("#dTop").value), fold = parseFloat($("#dFold").value);
        if (!(top > 0) || !(fold > 0)) { toast("Enter a top concentration and a fold dilution", true); return; }
        const rows = sel().sort((a, b) => a.cap - b.cap), k = rows.length;
        rows.forEach((x, j) => { const step = dir === "down" ? j : k - 1 - j; x.conc = +(top / Math.pow(fold, step)).toPrecision(4); });
        drawGrid(); syncDirty(); toast(`Filled ${k} concentrations`);
      };
      $("#aClr").onclick = () => apply(x => x.conc = null, `Cleared ${n} concentrations`);
    }
    $("#runSel").onchange = e => {
      if (dirty() && !confirm("You have unsaved changes in this run. Discard them?")) { e.target.value = ES.run; return; }
      ES.run = e.target.value; store.set("nanodsf_edit_run", ES.run); pageEdit(P);
    };
    $("#prot").oninput = e => { ES.protein = e.target.value; syncDirty(); };
    $("#save").onclick = () => send("save_layout", { run: ES.run, rows: ES.rows, protein: ES.protein.trim() });
    $("#rev").onclick = () => { ES.rows = ES.orig.map(r => Object.assign({}, r)); ES.protein = ES.protOrig; $("#prot").value = ES.protein;
      drawGrid(); syncDirty(); toast("Changes reverted"); };
    $("#exp").onclick = () => {
      const head = ["Capillary", "Molecule ID", "Concentration", "Units", "Role", "Notes"];
      download([head.join(","), ...ES.rows.map(r => [r.cap, r.mol, r.conc ?? "", r.units, r.role, r.notes].map(csvCell).join(","))].join("\n"), `${ES.run}_layout.csv`);
    };
    $("#imp").onchange = async e => { const f = e.target.files[0]; if (!f) return; send("import_layout", { run: ES.run, name: f.name, b64: await readB64(f) }); e.target.value = ""; };
    $("#del").onclick = () => $("#modal").classList.add("on");
    $("#mNo").onclick = () => $("#modal").classList.remove("on");
    $("#mYes").onclick = () => { $("#modal").classList.remove("on"); send("delete_run", { run: ES.run }); };
    drawGrid(); drawSide(); syncDirty();
  }

  // ================================================================== ADD RUN
  let AS = { layout: null };
  function pageAdd(P) {
    const pend = P.pending || [], hasRaw = pend.some(f => f.kind === "raw");
    const runId = AS.runId ?? P.suggested ?? "";
    const exists = P.runs.includes(runId.trim());
    $("#app").innerHTML = `
      <div class="bar">${brand("Add run")}<div class="spacer"></div>
        <button class="btn" id="tpl">${ICON.dl}Blank layout template</button>${themeMenu()}</div>
      <div class="addwrap">
        <div class="card" style="display:flex;flex-direction:column;gap:12px;padding:14px;min-height:0;overflow:auto">
          <label class="drop" id="drop"><input type="file" id="fi" accept=".xlsx" multiple>
            <div>${ICON.cloud}<b>Drop the raw and processed exports here</b>or click to choose · .xlsx from PR.ThermControl · order doesn't matter</div></label>
          ${pend.length ? `<div class="files">${pend.map(f => `<div class="file">${ICON.file}<span class="nm">${esc(f.name)}</span>
              <span class="pill ${f.kind === "raw" ? "raw" : "proc"}">${f.kind.toUpperCase()}</span>
              <span class="meta">${f.caps} caps${f.start ? " · " + esc(f.start.replace("T", " ").slice(0, 16)) : ""}</span></div>`).join("")}
              ${hasRaw ? "" : `<div class="file"><span class="pill warn">MISSING</span><span class="nm" style="color:var(--muted)">The raw export is required — add it too.</span></div>`}
              <button class="chip" id="clr" style="align-self:flex-start">Start over</button></div>` : ""}
          ${P.saved ? `<div class="ok"><b>✓ Saved “${esc(P.saved)}”</b><span style="color:var(--muted)">Next: name the molecules and mark the controls, then compare curves.</span>
              <div class="row"><button class="btn primary" id="toEdit">Edit runs ${ICON.arrow}</button><button class="btn" id="toOv">Open Overlay ${ICON.arrow}</button></div></div>` : ""}
        </div>
        <div class="card form">
          <div class="steps" style="padding:0">
            <div class="step ${pend.length ? "done" : ""}"><span class="n">1</span><div class="t"><b>Add the exported files</b>Both the raw and the processed Excel export from one run.</div></div>
            <div class="step ${runId.trim() ? "done" : ""}"><span class="n">2</span><div class="t"><b>Name the run</b>A short, unique name, e.g. ProteinX_2026-01-15.</div></div>
            <div class="step ${AS.layout ? "done" : ""}"><span class="n">3</span><div class="t"><b>Layout (optional)</b>What's in each capillary — or fill it in afterwards on Edit runs.</div></div>
          </div>
          <div class="sep"></div>
          <div class="f"><span class="lab">Run ID</span><input class="field" id="rid" value="${esc(runId)}" placeholder="e.g. ProteinX_2026-01-15"></div>
          ${exists ? `<label class="check"><input type="checkbox" id="ow" ${AS.overwrite ? "checked" : ""}> A run called “${esc(runId)}” exists — replace it</label>` : ""}
          <div class="f"><span class="lab">Protein</span><input class="field" id="prot" value="${esc(AS.protein || "")}" placeholder="e.g. ProteinX"></div>
          <div class="f"><span class="lab">Capillary layout</span>
            <label class="drop small" id="ldrop"><input type="file" id="lfi" accept=".xlsx,.csv">
              <div>${AS.layout ? `${ICON.file}<b style="font-size:12px">${esc(AS.layout.name)}</b><span>click to replace</span>` : `${ICON.up}<b style="font-size:12px">Drop a layout file</b>Excel or CSV with Capillary, Molecule ID, Concentration, Units, Role`}</div></label></div>
          <div class="spacer"></div>
          <button class="btn primary" id="save" style="height:38px;justify-content:center" ${hasRaw && runId.trim() && (!exists || AS.overwrite) ? "" : "disabled"}>${ICON.save}Save run</button>
        </div>
      </div>
      <div class="busy" id="busy"><i></i></div>`;
    wireMenus($("#app"));
    const take = async files => { files = [...files].filter(f => /\.xlsx$/i.test(f.name)); if (!files.length) return;
      AS.runId = undefined; send("inspect", { files: await Promise.all(files.map(async f => ({ name: f.name, b64: await readB64(f) }))) }); };
    const dz = $("#drop");
    ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("over"); }));
    ["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove("over"); }));
    dz.addEventListener("drop", e => take(e.dataTransfer.files));
    $("#fi").onchange = e => take(e.target.files);
    const ld = $("#ldrop"), takeL = async f => { if (!f) return; AS.layout = { name: f.name, b64: await readB64(f) }; pageAdd(P); };
    ["dragenter", "dragover"].forEach(ev => ld.addEventListener(ev, e => { e.preventDefault(); ld.classList.add("over"); }));
    ["dragleave", "drop"].forEach(ev => ld.addEventListener(ev, e => { e.preventDefault(); ld.classList.remove("over"); }));
    ld.addEventListener("drop", e => takeL(e.dataTransfer.files[0]));
    $("#lfi").onchange = e => takeL(e.target.files[0]);
    $("#rid").oninput = e => { AS.runId = e.target.value; const ex = P.runs.includes(AS.runId.trim());
      if (ex !== exists) { pageAdd(P); const r = $("#rid"); r.focus(); r.setSelectionRange(r.value.length, r.value.length); return; }
      $("#save").disabled = !(hasRaw && AS.runId.trim() && (!ex || AS.overwrite)); };
    $("#prot").oninput = e => AS.protein = e.target.value;
    if ($("#ow")) $("#ow").onchange = e => { AS.overwrite = e.target.checked; pageAdd(P); };
    if ($("#clr")) $("#clr").onclick = () => { AS = { layout: null }; send("clear_pending"); };
    if ($("#toEdit")) $("#toEdit").onclick = () => { store.set("nanodsf_edit_run", P.saved); go("page_edit"); };
    if ($("#toOv")) $("#toOv").onclick = () => go("");
    $("#save").onclick = () => send("save_run", { run_id: (AS.runId ?? runId).trim(), protein: (AS.protein || "").trim(), overwrite: !!AS.overwrite, layout: AS.layout });
    $("#tpl").onclick = () => {
      const lines = ["Capillary,Molecule ID,Concentration,Units,Role,Notes"];
      for (let i = 1; i <= 24; i++) lines.push(`${i},,,µM,sample,`);
      download(lines.join("\n"), "nanoDSF_layout_template.csv");
    };
  }

  // ================================================================== EMPTY (Overlay with no runs)
  function pageEmpty() {
    $("#app").innerHTML = `<div class="bar">${brand("Overlay")}<div class="spacer"></div>${themeMenu()}</div>
      <div class="card" style="flex:1"><div class="empty"><div><b>No runs in the library yet</b>
      <span style="display:block;margin-bottom:14px">Upload the raw and processed exports from your first run to get started.</span>
      <button class="btn primary" id="toAdd">Add a run ${ICON.arrow}</button></div></div></div>`;
    wireMenus($("#app")); $("#toAdd").onclick = () => go("page_add");
  }

  // ------------------------------------------------------------------ Streamlit render loop
  let ARGS = null, version = null, lastMsg = null;
  function render(force) {
    if (!ARGS) return;
    const P = ARGS.payload, pg = ARGS.page;
    if (pg === "results") pageResults(P);
    else if (pg === "edit") pageEdit(P, force === "keep");
    else if (pg === "add") pageAdd(P);
    else pageEmpty();
  }
  window.addEventListener("message", e => {
    const d = e.data;
    if (!d || d.type !== "streamlit:render") return;
    ARGS = d.args; applyTheme(); fit();
    const m = ARGS.msg;
    const fresh = m && m.nonce !== lastMsg;
    if (fresh) { lastMsg = m.nonce; }
    if (fresh && m.ok && ARGS.page === "add" && (m.action === "save_run" || m.action === "clear_pending")) AS = { layout: null };
    if (ARGS.version !== version) {
      version = ARGS.version;
      // after a failed save on Edit runs, keep what was typed
      render(fresh && !m.ok && ARGS.page === "edit" ? "keep" : undefined);
    } else if (fresh && ARGS.page === "add") render();
    busy(false);
    if (fresh && !(lastMsg === null)) { if (store.get("nanodsf_seen_msg", null) !== m.nonce) { store.set("nanodsf_seen_msg", m.nonce); toast(m.text, !m.ok); } }
  });
  post("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
