[project]
name = "chem-vault"
version = "0.1.0"
description = "Chemical compound management & screening platform"
requires-python = ">=3.13"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # DI + Railway
    "lagom>=2.7.0",
    "returns>=0.23.0",
    # Auth
    "sentinel-auth-sdk",
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.0",
    # Chemistry
    "rdkit>=2024.9.1",
    "chembl-structure-pipeline>=1.2.4",
    # Cache / PubSub
    "redis>=5.2.0",
    # Workflow
    "temporalio>=1.9.0",
    # Storage
    "fsspec>=2024.10.0",
    # Science
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    # Logging
    "structlog>=24.4.0",
    "asteval>=1.0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "testcontainers[postgres]>=4.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "import-linter>=2.11",
    "respx>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chem_vault"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker (testcontainers)",
]

# ---------------------------------------------------------------------------
# Import Linter — enforces Clean Architecture dependency rules
# Run: uv run lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["chem_vault"]
include_external_packages = true

# Rule 1: Layer dependency direction (domain → app → infra → interface)
[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "chem_vault.interface",
    "chem_vault.infrastructure",
    "chem_vault.application",
    "chem_vault.domain",
]

# Rule 2: Domain layer can only import stdlib, pydantic, returns, and itself
[[tool.importlinter.contracts]]
name = "Domain purity"
type = "forbidden"
source_modules = ["chem_vault.domain"]
forbidden_modules = [
    "chem_vault.application",
    "chem_vault.infrastructure",
    "chem_vault.interface",
    "fastapi",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "rdkit",
    "redis",
    "temporalio",
    "httpx",
    "lagom",
    "fsspec",
    "scipy",
    "numpy",
    "pandas",
    "structlog",
]

# Rule 3: No cross-context domain imports (each context only uses shared)
[[tool.importlinter.contracts]]
name = "Bounded context independence — chemical_registration"
type = "independence"
modules = [
    "chem_vault.domain.chemical_registration",
    "chem_vault.domain.screening_assay",
    "chem_vault.domain.inventory",
    "chem_vault.domain.formulation",
    "chem_vault.domain.sar_analysis",
    "chem_vault.domain.research_organization",
    "chem_vault.domain.audit_compliance",
    "chem_vault.domain.workspace_config",
]
