[project]
name = "cellar"
version = "0.1.0"
description = "Chemical compound management & screening platform"
requires-python = ">=3.13"
dependencies = [
    # Web
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.33",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "pymysql>=1.2.4",  # legacy plate-tracker migration read (scripts/migrate_legacy_plate_tracker.py); removable post-cutover
    # Validation
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    # DI + Railway
    "lagom>=2.7.0",
    "returns>=0.30.0",
    # Auth
    "duar-auth>=1.5.2",
    "pyjwt[crypto]>=2.14.0",
    "httpx>=0.28.0",
    # Chemistry
    "rdkit>=2026.9.1",
    "chembl-structure-pipeline>=1.2.4",
    # Cache / PubSub
    "redis>=5.2.0",
    # Workflow
    "temporalio>=1.9.0",
    # Storage
    "fsspec>=2026.9.0",
    # Science
    "scipy>=1.14.0",
    "lmfit>=1.3.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "openpyxl>=3.1.0",
    # openpyxl reads uploaded spreadsheets through defusedxml when it is installed.
    "defusedxml>=0.7.1",
    "matplotlib>=3.11.2",
    "weasyprint>=62",
    "Jinja2>=3.1",
    # Logging
    "structlog>=24.4.0",
    "asteval>=1.0.8",
    "umap-learn>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "testcontainers[postgres]>=4.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "import-linter>=2.16",
    "respx>=0.23.0",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellar"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker (testcontainers)",
]

# ---------------------------------------------------------------------------
# Import Linter — enforces Clean Architecture dependency rules
# Run: uv run lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["cellar"]
include_external_packages = true

# Rule 1: Layer dependency direction (domain → app → infra → interface)
[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "cellar.interface",
    "cellar.infrastructure",
    "cellar.application",
    "cellar.domain",
]

# Rule 2: Domain layer can only import stdlib, pydantic, returns, and itself
[[tool.importlinter.contracts]]
name = "Domain purity"
type = "forbidden"
source_modules = ["cellar.domain"]
forbidden_modules = [
    "cellar.application",
    "cellar.infrastructure",
    "cellar.interface",
    "fastapi",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "rdkit",
    "redis",
    "temporalio",
    "httpx",
    "lagom",
    "fsspec",
    "scipy",
    "numpy",
    "lmfit",
    "pandas",
    "structlog",
]

# Rule 3: No cross-context domain imports (each context only uses shared)
[[tool.importlinter.contracts]]
name = "Bounded context independence — chemical_registration"
type = "independence"
modules = [
    "cellar.domain.chemical_registration",
    "cellar.domain.screening_assay",
    "cellar.domain.inventory",
    "cellar.domain.formulation",
    "cellar.domain.sar_analysis",
    "cellar.domain.research_organization",
    "cellar.domain.audit_compliance",
    "cellar.domain.workspace_config",
]
