[project]
name = "chem-vault"
version = "0.1.0"
description = "Chemical compound management & screening platform"
requires-python = ">=3.13"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # DI + Railway
    "lagom>=2.7.0",
    "returns>=0.23.0",
    # Auth
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.0",
    # Chemistry
    "rdkit>=2024.9.1",
    # Cache / PubSub
    "redis>=5.2.0",
    # Workflow
    "temporalio>=1.9.0",
    # Storage
    "fsspec>=2024.10.0",
    # Science
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    # Logging
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "testcontainers[postgres]>=4.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chem_vault"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
