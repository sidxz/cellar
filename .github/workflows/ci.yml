name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job only checks out and builds/tests — no writes.
permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run ruff check src/
      - run: uv run ruff format --check src/
      - run: uv run lint-imports

  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run pytest tests/unit/ -v --cov=cellar --cov-report=term-missing

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
      - run: uv sync --dev
      # Testcontainers needs Docker — already available on ubuntu-latest
      - run: uv run pytest tests/integration/ -v --cov=cellar --cov-report=term-missing

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # `pnpm lint` is biome-only; tsc is the only thing that catches type errors
      # outside the heavy docker build.
      - run: pnpm exec tsc --noEmit

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: cellar # images build as cellar-backend / cellar-frontend
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f docker-compose.infra.yml -f docker-compose.yml build backend frontend
      # The unit tests run on the runner, which ships Pango and fonts; only a render
      # inside the built image catches a native lib the image itself is missing.
      - name: PDF export renders inside the backend image
        run: docker run --rm --entrypoint /app/.venv/bin/python cellar-backend -c "from weasyprint import HTML; assert HTML(string='<p>IC50 ≥ 5 µM</p>').write_pdf()[:5] == b'%PDF-'"
