# Production app stack — pulls images from GHCR. Always combined with infra:
#   docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml up -d
# Pin a release by setting CELLAR_TAG (defaults to latest):
#   CELLAR_TAG=0.2.0 docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml up -d
services:
  migrate:
    image: ghcr.io/sidxz/cellar-backend:${CELLAR_TAG:-latest}
    command: [".venv/bin/alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cellar}:${POSTGRES_PASSWORD:-cellar}@postgres:5432/${POSTGRES_DB:-cellar}

  backend:
    image: ghcr.io/sidxz/cellar-backend:${CELLAR_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cellar}:${POSTGRES_PASSWORD:-cellar}@postgres:5432/${POSTGRES_DB:-cellar}
      REDIS_URL: redis://valkey:6379
      DUAR_URL: ${APP_DUAR_URL:-http://duar:9003}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      STORAGE_ROOT: /data/storage
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INFISICAL_BASE_URL: http://infisical:8080
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - file-storage:/data/storage

  temporal-worker:
    image: ghcr.io/sidxz/cellar-backend:${CELLAR_TAG:-latest}
    command: [".venv/bin/python", "-m", "cellar.infrastructure.temporal.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cellar}:${POSTGRES_PASSWORD:-cellar}@postgres:5432/${POSTGRES_DB:-cellar}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      STORAGE_ROOT: /data/storage
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INFISICAL_BASE_URL: http://infisical:8080
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
    volumes:
      - file-storage:/data/storage

  frontend:
    image: ghcr.io/sidxz/cellar-frontend:${CELLAR_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      APP_API_URL: ${APP_API_URL:-http://localhost:8000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_DUAR_URL: ${APP_DUAR_URL:-http://localhost:9003}
      APP_IDP_PROVIDER: ${APP_IDP_PROVIDER:-google}
      APP_GOOGLE_CLIENT_ID: ${APP_GOOGLE_CLIENT_ID:-}
      APP_ENTRA_ID_CLIENT_ID: ${APP_ENTRA_ID_CLIENT_ID:-}
      APP_ENTRA_ID_TENANT_ID: ${APP_ENTRA_ID_TENANT_ID:-}
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "3000:3000"

volumes:
  file-storage:
